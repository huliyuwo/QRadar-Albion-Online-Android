plugins {
    id 'com.android.application'
}

android {
    compileSdkVersion 34
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "com.qradar.albion"
        minSdkVersion 24
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"

        // 不再在这里绑定 signingConfigs.release，否则 CI 上找不到 keystore 直接崩
        // signingConfig signingConfigs.release   <-- 删掉这行

        // API_KEY 读取保护：CI 上没有 local.properties 时给默认值，避免抛异常
        def apiKey = ""
        def localProps = rootProject.file("local.properties")
        if (localProps.exists()) {
            def properties = new Properties()
            properties.load(localProps.newDataInputStream())
            apiKey = properties.getProperty("API_KEY", "")
        }
        buildConfigField "String", "API_KEY", "\"${apiKey}\""
    }

    // 条件签名配置：只有当提供了 RELEASE_STORE_FILE 时才启用 release 签名
    signingConfigs {
        debug {
            // debug 签名用默认的就行
        }
        release {
            if (project.hasProperty("RELEASE_STORE_FILE")) {
                storeFile file(RELEASE_STORE_FILE)
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            if (project.hasProperty("RELEASE_STORE_FILE")) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // 对齐 kotlin-stdlib 各子包版本，避免 1.8.0 与传递依赖带入的 jdk7/jdk8 1.6.0 重复类冲突
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.0')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation project(':vpnadaptercore')
    implementation 'org.greenrobot:eventbus:3.3.1'
}